apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalingpolicies.doorman.zeromagic.io
spec:
  group: doorman.zeromagic.io
  scope: Namespaced
  names:
    plural: scalingpolicies
    singular: scalingpolicy
    kind: ScalingPolicy
    shortNames:
      - sp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                serviceName:
                  type: string
                deploymentName:
                  type: string
              required:
                - serviceName
                - deploymentName
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Running
                    - ScalingDown
                    - ScaledDown
                    - ScalingUp
                    - Stopped
                lastTransitionTime:
                  type: string
                  format: date-time
                message:
                  type: string
                targetReplicas:
                  type: integer
                  minimum: 0
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Replicas
          type: integer
          jsonPath: .status.targetReplicas
  preserveUnknownFields: false
