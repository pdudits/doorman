apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: doorman-demo
resources:
  - namespace.yaml
  - echo-deployment.yaml
  - echo-service.yaml
  - echo-ingress.yaml
  - echo-scalingpolicy.yaml

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: echo
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: traefik
      - op: replace
        path: /spec/rules/0/host
        value: echo2.localtest.me

